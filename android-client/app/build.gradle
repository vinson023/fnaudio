plugins {
    id "com.android.application"
}

def releaseStoreFile = project.findProperty("fnaudioReleaseStoreFile") ?: System.getenv("FNAUDIO_RELEASE_STORE_FILE")
def releaseStorePassword = project.findProperty("fnaudioReleaseStorePassword") ?: System.getenv("FNAUDIO_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = project.findProperty("fnaudioReleaseKeyAlias") ?: System.getenv("FNAUDIO_RELEASE_KEY_ALIAS")
def releaseKeyPassword = project.findProperty("fnaudioReleaseKeyPassword") ?: System.getenv("FNAUDIO_RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.fnaudio.client"
    compileSdk 36

    defaultConfig {
        applicationId "com.fnaudio.client"
        minSdk 23
        targetSdk 36
        versionCode 318
        versionName "0.2.50"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.assets.srcDirs += ["../../src/app/ui"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ["META-INF/DEPENDENCIES", "META-INF/NOTICE*", "META-INF/LICENSE*"]
        // The official Tpps gomobile runtime is distributed as an extracted
        // native library. Preserve that loading model for ARM64/16 KB devices.
        jniLibs.useLegacyPackaging = true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
        // Isolated build for validating the public fnOS MediaBrowser/MediaSession.
        // It has a different application id and can be installed beside normal fnAudio.
        mediaSession {
            initWith debug
            applicationIdSuffix ".mediasession"
            versionNameSuffix "-mediasession"
            debuggable true
            buildConfigField "boolean", "FNOS_MEDIA_SESSION_TEST", "true"
        }
    }
}

tasks.register("verifyReleaseSigning") {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException("Release signing is required. Set FNAUDIO_RELEASE_STORE_FILE, FNAUDIO_RELEASE_STORE_PASSWORD, FNAUDIO_RELEASE_KEY_ALIAS and FNAUDIO_RELEASE_KEY_PASSWORD.")
        }
        if (!file(releaseStoreFile).isFile()) {
            throw new GradleException("Release keystore does not exist: ${releaseStoreFile}")
        }
    }
}

tasks.configureEach {
    if (name == "preReleaseBuild") {
        dependsOn(tasks.named("verifyReleaseSigning"))
    }
}

dependencies {
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.media3:media3-exoplayer:1.10.1"
    implementation "androidx.media3:media3-session:1.10.1"
    implementation "androidx.media3:media3-datasource-okhttp:1.10.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    androidTestImplementation "com.squareup.okhttp3:okhttp-tls:4.12.0"
}
